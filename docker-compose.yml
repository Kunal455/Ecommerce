services:
  frontend:
    build:
      context: ./frontend
    container_name: ecommerce_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecommerce_network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      - REDIS_URL=redis://redis:6379
      - PERF_LOG=true
      - PERF_SLOW_THRESHOLD=500
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ecommerce_network
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - ecommerce_network

  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge
